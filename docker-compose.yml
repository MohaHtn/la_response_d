name: la_response_d

services:
  redis:
    image: redis:7-alpine
    container_name: la_response_d-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: la_response_d-server
    env_file:
      - server/.env
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_PASSWORD=
      - UVICORN_WORKERS=2
      - PYTHONPATH=/app
    depends_on:
      redis:
        condition: service_healthy
    # Pas d'exposition de port côté hôte: le client proxy /api -> server:8000
    restart: unless-stopped

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: la_response_d-client
    environment:
      # Le front appellera l'API via le proxy Nginx local (/api)
      - VITE_API_BASE=/api
    ports:
      - "5187:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  redis-data:
