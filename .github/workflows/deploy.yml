name: Deploy to Server

on:
  push:
    branches:
      - main  # Ou la branche de votre choix

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/mohahtn/la_response_d
            git pull origin main
            
            # Créer le fichier .env pour le serveur
            mkdir -p server
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > server/.env
            echo "PIXTRAL_API_KEY=${{ secrets.PIXTRAL_API_KEY }}" >> server/.env
            echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> server/.env
            echo "JWT_EXPIRATION_HOURS=${{ secrets.JWT_EXPIRATION_HOURS }}" >> server/.env
            
            # Variables d'environnement pour Redis
            echo "REDIS_HOST=redis" >> server/.env
            echo "REDIS_PORT=6379" >> server/.env
            echo "REDIS_DB=0" >> server/.env
            echo "REDIS_PASSWORD=" >> server/.env
            
            # Déploiement avec docker-compose
            docker compose down
            docker compose up -d --build
            docker system prune -f
