name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            # Essayer les deux variantes de nom (reponse vs response)
            if [ -d "/home/mohahtn/la_reponse_d" ]; then
              cd "/home/mohahtn/la_reponse_d"
            elif [ -d "/home/mohahtn/la_response_d" ]; then
              cd "/home/mohahtn/la_response_d"
            else
              echo "Repertoire non trouvé, tentative de clonage..."
              cd /home/mohahtn
              git clone https://github.com/${{ github.repository }}.git la_response_d
              cd la_response_d
            fi

            git pull origin main
            
            # Créer ou mettre à jour le fichier .env pour le service server
            # Note: docker-compose.yml pointe vers server/.env
            mkdir -p server
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" > server/.env
            echo "PIXTRAL_API_KEY=${{ secrets.PIXTRAL_API_KEY }}" >> server/.env
            echo "JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}" >> server/.env
            
            # Stopper les anciens conteneurs pour éviter les conflits de noms
            docker compose down
            
            docker compose up -d --build
            docker system prune -f