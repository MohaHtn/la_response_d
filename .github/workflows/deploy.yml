name: Deploy to Server

on:
  push:
    branches:
      - main  # Ou la branche de votre choix

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy to Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/mohahtn/la_response_d
            git pull origin main
            
            # Créer le fichier .env si nécessaire ou s'assurer qu'il existe
            # Les variables sont gérées par docker-compose via l'environnement du shell
            
            export GEMINI_API_KEY="${{ secrets.GEMINI_API_KEY }}"
            export PIXTRAL_API_KEY="${{ secrets.PIXTRAL_API_KEY }}"
            export JWT_SECRET_KEY="${{ secrets.JWT_SECRET_KEY }}"
            export JWT_EXPIRATION_HOURS="${{ secrets.JWT_EXPIRATION_HOURS }}"
            
            # Utiliser le script de déploiement (adapté pour Linux si besoin ou docker-compose direct)
            docker compose up -d --build
            docker system prune -f
